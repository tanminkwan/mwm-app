# CodeQL 코드 취약점 점검
#
# 공개 저장소(tanminkwan/mwm-app)에서만 돈다. 비공개 원본은 GitHub Advanced Security 가
# 없어 결과 업로드가 거부된다 — 그래서 job 을 건너뛴다(실패가 아니라 skipped).
# 결과는 공개 저장소의 Security → Code scanning 탭에 쌓인다.
#
# Advanced setup 이다. 저장소 설정의 Default setup 과 동시에 켜면 충돌하므로 Default 는 끈 채로 둔다.

name: CodeQL

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # 코드가 그대로여도 새 쿼리로 다시 본다. 월요일 09:30 KST (Dependabot 09:00 뒤)
    - cron: "30 0 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    if: github.repository == 'tanminkwan/mwm-app'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write   # 결과(SARIF) 업로드

    strategy:
      fail-fast: false
      matrix:
        # python    — 앱 코드
        # javascript — 템플릿(app/templates)의 인라인 스크립트
        # actions   — 이 워크플로들 자체 (스크립트 주입 등)
        language: [ "python", "javascript-typescript", "actions" ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          languages: ${{ matrix.language }}
          # 인터프리터 언어라 빌드가 필요 없다
          build-mode: none
          # 기본 쿼리 + 보안 확장 쿼리
          queries: security-extended
          # app/static/js 는 전부 외부 라이브러리(jQuery, toastui, mermaid ...)의 사본이다.
          # 여기서 나온 경고는 우리 코드가 고칠 수 없는 것이라 뺀다.
          # 라이브러리 버전 자체의 취약점은 이 점검의 대상이 아니다.
          config: |
            paths-ignore:
              - app/static/js
              - app/static/css

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
