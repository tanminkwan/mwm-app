{% extends "appbuilder/general/model/edit.html" %}

{% block tail_js %}
{{ super() }}
<script type="text/javascript">
    $(document).ready(function () {
        var callbackField = $('#broadcast_callback');

        // broadcast_callback 필드 아래에 안내 문구 삽입
        if (callbackField.length) {
            var helpHtml = '<p class="help-block" style="color:#2980b9;">' +
                '<b>사용 가능:</b> {{ broadcast_callbacks | join(", ") }}' +
                '</p>' +
                '<p class="help-block" style="color:#27ae60;">' +
                '<b>파라미터:</b> 함수명(인자) 형식으로 입력 가능 (예: get_was_agents_newgen(PROD))' +
                '</p>' +
                '<p class="help-block" style="color:#e74c3c;">' +
                '※ Broadcast Callback, 대상 Agent, 대상 Agent 그룹 중 적어도 하나는 선택해야 합니다.' +
                '</p>';
            callbackField.after(helpHtml);
        }

        function handleBroadcastChange() {
            var broadcast_callback = callbackField.val();
            if (broadcast_callback && broadcast_callback.trim() !== '') {
                $('#ag_agent').prop('disabled', true);
                $('#ag_agent_group').prop('disabled', true);
                $('#ag_agent').val(null).trigger('change');
                $('#ag_agent_group').val(null).trigger('change');
            } else {
                $('#ag_agent').prop('disabled', false);
                $('#ag_agent_group').prop('disabled', false);
            }
        }
        callbackField.on('change keyup', handleBroadcastChange);
        handleBroadcastChange();

        // command_sender=MQTT 는 실시간 push 전용이므로 실행구분을 즉시작업으로 고정한다.
        // 서버단 before_insert/before_update 훅이 최종 강제하지만, UI 에서 막지 않으면
        // 사용자가 '주기작업'을 골랐다가 조용히 바뀌고, validator 가 결국 버려질
        // cycle_to_exe/time_to_exe 입력을 요구하게 된다.
        var senderField = $('#command_sender');
        var scheduleFields = '#time_to_exe, #time_to_stop, #cycle_to_exe, #interval_type';

{% if not config.MQTT_ENABLED %}
        // MQTT 비활성 서버에서는 선택지를 숨긴다. 고르더라도 publisher 가 없어
        // 발행 없이 '즉시작업 + 폴링 전달' 로 조용히 격하될 뿐이다
        // (app/sqls/agent.py:553 - publisher 가 None 이면 발행 분기를 건너뛴다).
        // 다만 이미 MQTT 로 저장된 건을 수정하는 중이면 남겨둔다. 현재 값의 선택지를
        // 지우면 저장 시 다른 값으로 조용히 바뀐다.
        if (senderField.val() !== 'MQTT') {
            senderField.find('option[value="MQTT"]').remove();
        }
{% endif %}

        function handleSenderChange() {
            var isMqtt = senderField.val() === 'MQTT';
            var periodic = $('#periodic_type');

            if (isMqtt) {
                periodic.val('IMMEDIATE').trigger('change');
                periodic.prop('disabled', true);
                $(scheduleFields).val(null).prop('disabled', true);
            } else {
                periodic.prop('disabled', false);
                $(scheduleFields).prop('disabled', false);
            }
        }

        // disabled 입력은 브라우저가 POST 에 담지 않는다. periodic_type/interval_type 은
        // FAB EnumField 이고 빈 선택지가 없어서(choices 는 enum 멤버뿐) 값이 오지 않으면
        // pre_validate 가 ValueError('Not a valid choice') 를 던진다. WTForms 3.1 의
        // Field.validate 는 ValidationError 만 잡으므로 폼 오류가 아니라 500 이 된다.
        // 제출 직전에 되살려 값이 실려 가게 한다. 서버 훅(_force_immediate_for_mqtt)이
        // 어차피 IMMEDIATE/null 로 덮으므로 실려 간 값 자체는 무해하다.
        function restoreBeforeSubmit() {
            $('#periodic_type').prop('disabled', false);
            $(scheduleFields).prop('disabled', false);
            // val(null) 로 선택이 해제된 select 는 전송할 값이 없다. 첫 선택지로 되돌린다.
            $('#periodic_type, #interval_type').each(function () {
                if (!$(this).val()) {
                    this.selectedIndex = 0;
                }
            });
        }

        if (senderField.length) {
            senderField.on('change', handleSenderChange);
            senderField.closest('form').on('submit', restoreBeforeSubmit);
            handleSenderChange();
        }
    });
</script>
{% endblock %}
