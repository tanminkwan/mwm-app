[pytest]
# IdP 테스트 설정 — 본 앱 pytest.ini (TASK 5-3) 와 같은 관문이다 (TASK 5-12).
# 테스트는 mwm-idp-test 컨테이너에서 /workspace 기준으로 돈다. 이 파일은 /workspace/pytest.ini 로 마운트한다.
testpaths = tests

# 엄격 모드
#   등록하지 않은 marker → 에러 (오타난 marker 가 조용히 무시되는 사고를 막는다)
#   pytest.ini 자체의 오타·미지원 키 → 에러
# ⚠ pytest 9 에서는 ini 옵션이어야 한다. `addopts = --strict-markers` 는 조용히 무시된다.
strict = True

# 지금 쓰는 marker 는 없다. 쓰려면 여기에 등록한다.
markers =

# 경고 정책 — **새로 생기는 DeprecationWarning 은 테스트를 실패시킨다** (라이브러리 업그레이드의 조기 경보).
# 본 앱은 서드파티 몇 건을 유예하지만, IdP 는 도입 시점에 0 건으로 맞췄으므로 유예 항목이 없다.
# 유예를 추가할 때는 본 앱처럼 이유를 함께 적는다.
filterwarnings =
    error::DeprecationWarning
