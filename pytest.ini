[pytest]
# 자동 수집 대상은 tests/ 뿐이다.
testpaths = tests

# tests/manual/ 은 살아있는 서버를 상대로 사람이 돌리는 스크립트다.
# pytest 가 import 하면 실제 HTTP 호출이 일어나므로 수집에서 제외한다.
norecursedirs = manual .git __pycache__ *.egg-info

# integration 은 기본 실행에서 제외한다.
#   메일 발송처럼 외부에 실제 영향을 주는 테스트가 여기 속한다.
#   실행하려면: pytest -m integration
addopts = -m "not integration"

# 엄격 모드 (TASK 5-3)
#   strict_markers  : 등록하지 않은 marker → 에러. 오타난 marker 는 조용히 무시되어
#                     "필터가 걸린 줄 알았는데 안 걸린" 사고를 낸다.
#   strict_config   : pytest.ini 자체의 오타·미지원 키 → 에러.
#   strict_xfail / strict_parametrization_ids 도 함께 켠다 (현재 해당 없음, 기본값 확립용).
#
# ⚠ pytest 9 에서는 **ini 옵션**이어야 한다. `addopts = --strict-markers` 는
#   조용히 무시된다(실측 확인). CLI 로 직접 주면 동작한다.
strict = True

markers =
    unit: 외부 의존(DB·네트워크) 없이 도는 순수 단위 테스트. WS-5-7 에서 늘린다.
    integration: 외부에 실제 영향을 주는 테스트 (메일 발송 등). 기본 실행에서 제외된다.

# -----------------------------------------------------------------------------
# 경고 정책 (TASK 5-3)
#
# DeprecationWarning 은 **Phase 5 업그레이드의 조기 경보**다.
# 168건 속에 묻혀 있으면 아무도 보지 않으므로 기본을 error 로 둔다.
# 지금 나는 것만 아래에 하나씩 이유와 함께 유예한다.
# **새로 생기는 Deprecation 은 테스트를 실패시킨다.**
#
# 유예 항목을 지울 때가 해당 업그레이드가 끝난 때다.
# -----------------------------------------------------------------------------
filterwarnings =
    error::DeprecationWarning

    # --- 서드파티. 해당 라이브러리를 올려야 없어진다 --------------------
    # Flask-AppBuilder 5.2.3 내부 — Python 3.12 의 datetime.utcnow() 사용 중단.
    # 오류로 두면 FAB 가 역할·사용자 생성 중에 이 예외를 삼켜 **역할이 만들어지지 않는다** (새 DB 에서만 드러남)
    ignore:datetime.datetime.utcnow\(\) is deprecated:DeprecationWarning:flask_appbuilder
    # marshmallow-sqlalchemy
    ignore:The '__version__' attribute is deprecated:DeprecationWarning
    # SQLAlchemy 1.4 (SADeprecationWarning 은 DeprecationWarning 의 하위 클래스다)
    ignore:The from_engine:DeprecationWarning
    # SQLAlchemy 2.0 비호환 API 총괄 경고(MovedIn20Warning). **WS-2-3d 의 핵심 지표다.**
    # 개별 항목을 보려면: SQLALCHEMY_WARN_20=1 환경변수로 실행한다.
    ignore:Deprecated API features detected:DeprecationWarning
